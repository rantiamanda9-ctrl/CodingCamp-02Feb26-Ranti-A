<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List-Ranti A</title>

    <!-- CSS External -->
    <link rel="stylesheet" href="css/style.css"> 

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>
    <!-- Header Content -->
     <header>
        <h1 class="text-3xl font-bold pb-5">Todo List - Ranti A</h1>
     </header>

    <!-- Main Content -->
    <main>
        <!-- Form Section -->
        <section>
            <form>
                <!-- Todo Input -->
                <input class="bolder p-2 rounded" type="text" id="todo-input" placeholder="Enter a new todo item">

                <!-- Date Input -->
                 <input class="bolder p-2 rounded" type="date" id="todo-date" placeholder="Enter due date">
            </form>

            <!-- Add Button -->
            <button class="bg-violet-300 text-white p-1 rounded hover:bg-violet-300" onclick="addTodo()" type="button">Add Todo</button>
        </section>

        <!-- Action Section -->
        <section class="flex pt-2 justify-between">
            <!-- Clear all button -->
            <button onclick="deleteAllTodos()" class="border rounded p-2 bg-pink-200 text-white">Clear All Todos</button>

            <!-- Filter Todos -->
            <button onclick="filterTodos()" class="border rounded p-2 bg-pink-200 text-white">Filter Todos</button>
        </section>
        
        <!-- Todo List Section -->
         <section class="pt-2">
            <header>
                <h1 class="text-lg font-semibold">List of Todos</h1>
            </header>

            <ul class="pt-2" id="todo-list"></ul>
        
         </section>
    </main>

    <!-- Footer Content -->
     <footer class="pt-8">
        <p class="text-center text-gray-500">ⓒ 2026 Ranti`s Todo Apps</p>
     </footer>

    <!-- Javascript External -->
    <script src="JS/script.js" defer></script>

</body>
</html>
